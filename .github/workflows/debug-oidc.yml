name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  print-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          set -euo pipefail
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo ""

          resp=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(echo "$resp" | jq -r .value)
          if [ "$token" = "null" ] || [ -z "$token" ]; then
            echo "Failed to get OIDC token"
            echo "$resp" | jq .
            exit 1
          fi

          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0=$0"="; print }' | base64 -d)
          echo "=== OIDC claims (audience=sts.amazonaws.com) ==="
          echo "$payload" | jq .

          echo ""
          echo "=== Trust policy に設定すべき sub ==="
          echo "$payload" | jq -r '.sub'

          echo ""
          echo "=== Trust policy に設定すべき aud ==="
          echo "$payload" | jq -r '.aud'
