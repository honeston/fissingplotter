# ローカル SAM（sam local start-api）専用。本番デプロイには template.yaml を使う。
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fissing Plotter — local API only (Docker Lambda + LocalStack)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 128

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: local
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: ../api/
      Environment:
        Variables:
          LOCAL_DEV: 'true'
          LOCAL_DEV_USER_ID: local-dev-user
          TABLE_NAME: fissingplotter-records
          WEATHER_CACHE_TABLE: fissingplotter-weather-cache
          MEDIA_BUCKET_NAME: fissingplotter-media-local
          AWS_ENDPOINT_URL: http://localstack:4566
          AWS_ENDPOINT_URL_PUBLIC: http://127.0.0.1:4566
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          # 空文字プレースホルダ。sam local --env-vars はテンプレートに無い変数を無視する
          OPENWEATHER_API_KEY: ''
          MSIL_SUBSCRIPTION_KEY: ''
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        GetRecords:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /records
            Method: GET
        PostRecord:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /records
            Method: POST
        DeleteRecord:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /records/{id}
            Method: DELETE
        PresignPhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/presign
            Method: POST
        GetPhotoUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/{recordId}/url
            Method: GET
        GetCurrentWeather:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /weather/current
            Method: GET
        GetCurrentTide:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tide/current
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: false
        Target: es2022
        Sourcemap: true
